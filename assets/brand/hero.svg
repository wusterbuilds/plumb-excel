    <text x="954" y="140" font-size="14">ASSUMPTION</text><text x="954" y="205" font-size="24">5.25%</text>
    <text x="1072" y="268" font-size="14">SCENARIO</text><text x="1072" y="333" font-size="30" font-weight="700">+IRR</text>
    <text x="842" y="396" font-size="14">STATUS</text><text x="842" y="462" font-size="18">TRACEABLE</text>
    <text x="1072" y="396" font-size="14">MODE</text><text x="1072" y="462" font-size="24">LOCAL</text>
