name: Bug report
description: Report reproducible unexpected behavior using synthetic data.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not attach customer workbooks, credentials, or private documents.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      description: Use a synthetic workbook or fixture.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, Excel version, Node version, and commit.
    validations:
      required: true
